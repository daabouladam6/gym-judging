# Fly.io app config — name must match your Fly app (see dashboard URL).
# Deploy without --image so Fly builds this Dockerfile (pinned images keep old PORT/listen behavior).
app = "artisticg-gymnastics-judging"
primary_region = "cdg"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "15s"
    grace_period = "60s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

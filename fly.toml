# Fly.io app config — name must match your Fly app (see dashboard URL).
# Change primary_region if you want the app closer to your users (e.g. "ams", "lhr", "syd").
app = "gym-judging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/"

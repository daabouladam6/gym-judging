# Fly.io app config — name must match your Fly app (see dashboard URL).
# Deploy without --image so Fly builds this Dockerfile (pinned images keep old PORT/listen behavior).
# Change primary_region if you want the app closer to your users (e.g. "ams", "lhr", "syd").
app = "artisticg-gymnastics-judging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Avoid stopping the only machine while Fly runs deploy health checks (timeouts seen with "stop" + min 0).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "15s"
  grace_period = "90s"
  method = "GET"
  path = "/"
